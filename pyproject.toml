[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyguard"
version = "0.1.0"
description = "Local RAG experiments and tooling for OSV security advisories"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sentence-transformers==5.6.1",
    "torch==2.9.0",
    "numpy==2.1.3",
    "transformers==4.57.1",
    "huggingface-hub==0.36.0",
    "tokenizers==0.22.1",
    "safetensors==0.6.2",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
supplyguard = "supplyguard.cli:main"
supplyguard-experiments = "supplyguard.run_experiments:main"
supplyguard-preprocess = "supplyguard.preprocess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supplyguard = ["evaluation/evaluation_set.json"]
