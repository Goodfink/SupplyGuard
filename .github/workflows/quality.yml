name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lightweight quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.3.4 ruff==0.17.1 mypy==2.4.0

      - name: Check formatting
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: python -m pytest
